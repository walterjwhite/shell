name: Build (Gentoo Linux)

on:


  workflow_dispatch:
    inputs:
      debug:
        description: "debug"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  conf_log_level: ${{ inputs.debug == true && '0' || '2' }}

jobs:
  build-gentoo:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:amd64-systemd-mergedusr
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: sync portage and test installing apps
        timeout-minutes: 30
        run: |
          emerge-webrsync
          emerge --oneshot --quiet net-misc/curl

      - name: Run App Install Verification
        uses: ./.github/actions/app-install
        with:
          platform: Linux
