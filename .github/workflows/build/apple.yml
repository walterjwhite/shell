name: Build (Apple)

on:
  push:
    branches: [dev]

    paths:
      - ".github/workflows/build-apple.yml"

      - "**" # Matches every file in the repo
      - "!.github/workflows/**" # EXCLUDES all workflow files except the one explicitly allowed above

  workflow_dispatch:
    inputs:
      debug:
        description: "debug"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  conf_log_level: ${{ inputs.debug == true && '0' || '2' }}

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run App Install Verification
        uses: ./.github/actions/app-install
        with:
          platform: Apple
