name: Build (FreeBSD)

on:
  push:
    branches: [dev]

    paths:
      - ".github/workflows/build-freebsd.yml"

      - "**" # Matches every file in the repo
      - "!.github/workflows/**" # EXCLUDES all workflow files except the one explicitly allowed above

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      debug:
        description: "debug"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  conf_log_level: ${{ inputs.debug == true && '0' || '2' }}

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: set up FreeBSD VM and test installing apps
        uses: cross-platform-actions/action@v1.2.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: "15.0"
          shell: bash
          timeout-minutes: 30
          run: |
            export conf_log_level="${{ env.conf_log_level }}"

            WORKSPACE_DIR="${{ github.workspace }}"

            sudo bash "$WORKSPACE_DIR/.github/actions/app-install/test.sh" "FreeBSD" "/usr/local/bin"
